[package]
name = "meridian"
version = "0.1.0"
description = "Solana binary options prediction market"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
demo-mode = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[package.metadata.solana]
tools-version = "v1.52"

[dependencies]
anchor-lang = "0.32.0"
anchor-spl = "0.32.0"
